# Maiplot — Prometheus dev scrape config.
#
# Services emit OTLP to otel-collector, which converts metrics to
# Prometheus exposition format and serves them on :8889/metrics.
# Prometheus scrapes that single endpoint instead of each service
# directly, so adding/removing services is a no-op here.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    # honor_labels keeps the `job` label that the OTel exporter sets
    # (e.g. job="maiplot/auth-service"); without it Prometheus rewrites
    # every series to job="otel-collector" and we lose per-service split.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
