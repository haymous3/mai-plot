# Maiplot — Grafana dashboard provisioning (SCRUM-40).
# Auto-loads every .json file dropped in this directory.

apiVersion: 1

providers:
  - name: maiplot-default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
