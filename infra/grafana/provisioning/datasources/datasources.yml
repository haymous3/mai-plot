# Maiplot — Grafana data source provisioning.
# Auto-wires Loki + Prometheus when Grafana boots.
# Tempo (traces) is added by SCRUM-40 alongside the OTel collector.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
