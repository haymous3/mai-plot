name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff check + ruff format check across every service.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: ruff check
        run: uv run ruff check services/

      - name: ruff format --check
        run: uv run ruff format --check services/

  # ---------------------------------------------------------------------------
  # Typecheck — mypy per service. The workspace has duplicate `app` packages
  # (one per service) so a single batch run collides; the per-service loop is
  # the same pattern documented in services/ + scripts/migrate-all.sh.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: mypy each service
        run: |
          for svc in services/*/; do
            echo "==> mypy $svc"
            (cd "$svc" && uv run mypy app tests)
          done

  # ---------------------------------------------------------------------------
  # Test — bring up postgres + redis from our docker-compose.yml (uses
  # init.sql for PostGIS/pgcrypto), run migrations, then pytest --cov.
  # Coverage XML is uploaded to Codecov; CODECOV_TOKEN must be set in repo
  # secrets for the upload to succeed on this private repo.
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest + Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Surfaced for the optional Docker Hub login below. Job-level env is
    # readable in step `if:` conditions (step-level env is not).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync workspace
        run: uv sync --all-packages

      # Authenticated Docker Hub pulls lift the anonymous rate limit that
      # causes the postgis/redis pulls below to intermittently time out. Runs
      # only if the repo has the DOCKERHUB_* secrets set; otherwise skipped
      # and the retry loop below is the safety net.
      - name: Log in to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Start postgres + redis
        # Pulling postgis/redis from Docker Hub can hit a transient
        # "registry-1.docker.io: context deadline exceeded". Retry so a
        # network blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d postgres redis; then
              exit 0
            fi
            echo "compose up failed (attempt $attempt) — likely a Docker Hub pull timeout; retrying in 15s"
            sleep 15
          done
          echo "compose up still failing after 3 attempts"
          exit 1

      - name: Wait for postgres healthcheck
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' maiplot-postgres)" = "healthy" ]; then
              echo "postgres healthy"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become healthy in 60s"
          docker logs maiplot-postgres
          exit 1

      - name: Run alembic migrations across all services
        run: bash scripts/migrate-all.sh

      - name: pytest per service with coverage
        # Per-service pytest is required because every service ships a
        # top-level `app` package and uv's editable install registers all
        # of them on sys.path — running pytest once at the root resolves
        # `import app` to whichever service is alphabetically first and
        # the other services' app.models become invisible. Per-service
        # invocation isolates the import root via each service's
        # conftest.py. Coverage is accumulated via --cov-append, combined
        # at the end, and emitted as a single XML for Codecov.
        run: |
          rm -f .coverage coverage.xml .coverage.*
          for svc in services/*/; do
            svc_name=$(basename "$svc")
            echo "==> pytest $svc_name"
            (cd "$svc" && uv run pytest --cov=app --cov-append --cov-config=../../pyproject.toml \
              --cov-report= --cov-report=term)
            # Move the per-service .coverage to the workspace root with a
            # service-tagged suffix so `coverage combine` can merge them.
            # basename strips the trailing slash that the services/*/ glob
            # leaves on $svc (otherwise mv treats the target as a missing
            # directory and fails).
            if [ -f "$svc.coverage" ]; then
              mv "$svc.coverage" ".coverage.$svc_name"
            fi
          done
          # Combine all per-service .coverage.* files into one and emit xml.
          uv run coverage combine || true
          uv run coverage xml -o coverage.xml || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false  # don't block on Codecov outage; the upload itself isn't AC-critical

      - name: Tear down postgres + redis
        if: always()
        run: docker compose down -v postgres redis

  # ---------------------------------------------------------------------------
  # Build — matrix over every service, just verify the Dockerfile compiles.
  # No push; pushing to GHCR for prod deployment is a separate ticket.
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - listing-service
          - document-service
          - transaction-service
          - loan-service
          - notification-service
          - realtor-service
          - analytics-service
    steps:
      - uses: actions/checkout@v4

      # Exports ACTIONS_RUNTIME_TOKEN/URL so `--cache-to type=gha` works in
      # the raw `docker buildx build` below (build-push-action used to do this
      # implicitly; the retry wrapper needs it set explicitly).
      - name: Export GitHub Actions runtime (for the gha build cache)
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticated pulls of the python:3.12-slim base lift the anonymous
      # rate limit that intermittently times out the build. Optional — runs
      # only when the DOCKERHUB_* secrets exist; the retry below is the
      # secret-free safety net.
      - name: Log in to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (retry on Docker Hub flake)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          # Raw buildx (not build-push-action) so the retry action can re-run
          # it on a transient base-image pull timeout. Same gha cache scope as
          # before; no --load/--push, so it just verifies the build compiles.
          command: >
            docker buildx build ./services/${{ matrix.service }}
            --tag maiplot-${{ matrix.service }}:ci
            --cache-from type=gha,scope=${{ matrix.service }}
            --cache-to type=gha,mode=max,scope=${{ matrix.service }}
