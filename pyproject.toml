[project]
name = "maiplot"
version = "0.1.0"
description = "Maiplot — Nigeria's distressed real estate marketplace (workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["\\.venv", "build", "dist"]
# Each service has its own `app/` package; explicit bases + namespace packages
# let mypy resolve them in isolation without colliding on the shared name.
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
python_files = ["test_*.py"]
# importlib mode lets identically-named test modules coexist across services
# without colliding on the default rootdir-based import (each service's
# tests/test_health.py would otherwise import as `tests.test_health`).
addopts = "--import-mode=importlib"
