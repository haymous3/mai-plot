[project]
name = "analytics-service"
version = "0.1.0"
description = "Maiplot Analytics Service — KPIs, admin reports (read replica)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
