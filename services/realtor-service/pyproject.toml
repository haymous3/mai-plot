[project]
name = "realtor-service"
version = "0.1.0"
description = "Maiplot Realtor Service — onboarding, assignments, commission"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # RUNTIME, not dev: app/adapters/registration_number.py imports httpx at
    # module scope to call auth-service when an admin approves a realtor
    # (SCRUM-207). It was in the dev group only, so the test venv had it and the
    # Docker image did not — the container crash-looped on
    # `ModuleNotFoundError: No module named 'httpx'` while every test, mypy and
    # ruff passed. The image build does not import the app, so CI was green too.
    "httpx>=0.27",
    # Government-ID upload (private S3) + multipart form parsing (SCRUM-71).
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    # Cross-service decision notifications: a Celery producer enqueues the
    # notification-service dispatch task on the shared Redis broker. Plain celery
    # (NOT celery[redis]) + a direct redis dep, per the workspace constraint.
    "redis>=5.0",
    "celery>=5.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # httpx is a RUNTIME dependency above — the ASGI test client also needs it,
    # and listing it twice is how it stayed dev-only when the adapter landed.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
