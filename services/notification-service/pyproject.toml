[project]
name = "notification-service"
version = "0.1.0"
description = "Maiplot Notification Service — Web Push, SMS (Termii), Email (SES)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # SMS via Termii (SCRUM-80). httpx is the real Termii client's transport
    # (runtime, not just tests). redis>=5.0 stays a direct dep; celery is plain
    # (NOT celery[redis] — the [redis] extra pins redis <6.5 via kombu, which
    # would downgrade the workspace from redis 8 and break mypy's typed from_url
    # in the shared test conftest). kombu's redis:// transport uses the direct
    # redis lib at runtime.
    "httpx>=0.27",
    "redis>=5.0",
    "celery>=5.3",
    # Web Push (SCRUM-79). pywebpush handles VAPID signing + payload encryption
    # (pulls in cryptography + py-vapid). Only the real client uses it; CI/dev
    # default to the in-memory fake.
    "pywebpush>=2.0",
    # Email (SCRUM-81). boto3 SES client; only the real client uses it, CI/dev
    # default to the in-memory fake.
    "boto3>=1.34",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
