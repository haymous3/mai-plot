[project]
name = "document-service"
version = "0.1.0"
description = "Maiplot Document Service — OCR, verification, watermarking, S3"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "pypdf>=4.2",
    "reportlab>=4.2",
    "redis>=5.0",
    # Plain celery (NOT celery[redis]): the [redis] extra pins redis <6.5 via
    # kombu, which would downgrade the workspace from redis 8 and break mypy's
    # typed `from_url` in the shared test conftest. The redis lib is already a
    # direct dep, so kombu's redis:// transport uses it at runtime.
    "celery>=5.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
