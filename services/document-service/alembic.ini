[alembic]
script_location = migrations
prepend_sys_path = .
# Identity for the per-service alembic version table (env.py reads this).
# Must stay unique across services sharing the database.
service_name = document
# sqlalchemy.url is supplied at runtime from $DATABASE_URL inside env.py.
# This placeholder is required by alembic's config parser but unused.
sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
