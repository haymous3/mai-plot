[project]
name = "transaction-service"
version = "0.1.0"
description = "Maiplot Transaction Service — state machine, escrow ledger, audit"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # Cross-service notifications (SCRUM-117): a Celery producer enqueues the
    # notification-service dispatch task on the shared Redis broker. Plain celery
    # (NOT celery[redis]) + a direct redis dep, per the workspace's redis-version
    # constraint; redis is used by kombu's redis:// transport at runtime.
    "redis>=5.0",
    "celery>=5.3",
    # Payment receipts → private S3 (SCRUM-86). Imported lazily inside the S3
    # adapter; the in-memory fake (dev/CI default) never touches it.
    "boto3>=1.34",
    # Paystack charge client (SCRUM-83). Imported lazily inside the real HTTP
    # client; the fake (dev/CI default) never touches it.
    "httpx>=0.27",
    # PDF payment receipts (SCRUM-85). Pure-Python, no system deps.
    "reportlab>=4.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
