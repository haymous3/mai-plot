[project]
name = "auth-service"
version = "0.1.0"
description = "Maiplot Auth Service — registration, OTP, JWT, BVN/NIN verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "redis>=5.0",
    # Cross-service notifications (SCRUM-113): a Celery producer enqueues the
    # notification-service dispatch task on the shared broker. Plain celery (NOT
    # celery[redis]) per the workspace redis-version constraint; redis (above) is
    # used by kombu's redis:// transport at runtime.
    "celery>=5.3",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
