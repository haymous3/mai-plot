[project]
name = "loan-service"
version = "0.1.0"
description = "Maiplot Loan Service — bank partner adapters, loan workflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # Real bank-partner HTTP adapter (SCRUM-76); also used for /loans/apply proxy.
    "httpx>=0.27",
    # Producer-only: enqueues the notification-service dispatch task on the shared
    # broker for the loan-decision webhook (SCRUM-76). Plain celery (NOT
    # celery[redis]) per the workspace redis-version constraint; imported lazily.
    "celery>=5.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
