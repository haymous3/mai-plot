[project]
name = "loan-service"
version = "0.1.0"
description = "Maiplot Loan Service — bank partner adapters, loan workflow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    # Real bank-partner HTTP adapter (SCRUM-76); also used for /loans/apply proxy.
    "httpx>=0.27",
    # Celery over the shared Redis broker: producer for the notification dispatch
    # task (SCRUM-76) and, since SCRUM-130, a real worker + beat for the loan
    # status-poll fallback. Plain celery (NOT celery[redis]) + a direct redis dep,
    # per the workspace's redis-version constraint — kombu's redis:// transport
    # imports the redis lib at worker startup, so it must be a runtime dependency.
    "redis>=5.0",
    "celery>=5.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "structlog>=24.1",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
