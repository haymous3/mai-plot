# Maiplot — local development stack.
# Run: docker compose up -d
#
# SCRUM-35 boots the full infrastructure (this file) and 8 FastAPI service
# stubs + Next.js web stub. Deep config (Kong routing, ES mappings,
# Grafana dashboards) is owned by SCRUM-37 / SCRUM-39 / SCRUM-40.

name: maiplot

services:

  # =====================================================================
  # Data tier
  # =====================================================================

  postgres:
    image: postgis/postgis:15-3.4
    container_name: maiplot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maiplot}
      POSTGRES_USER: ${POSTGRES_USER:-maiplot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maiplot} -d ${POSTGRES_DB:-maiplot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maiplot-net

  redis:
    image: redis:7-alpine
    container_name: maiplot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - maiplot-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: maiplot-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - maiplot-net

  # =====================================================================
  # Gateway
  # =====================================================================

  kong:
    image: kong:3.7
    container_name: maiplot-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./infra/kong:/etc/kong:ro
    ports:
      - "8000:8000"   # public proxy (per SCRUM-35 AC)
      - "8001:8001"   # admin API
    networks:
      - maiplot-net

  # =====================================================================
  # Observability
  # =====================================================================

  loki:
    image: grafana/loki:3.0.0
    container_name: maiplot-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - maiplot-net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: maiplot-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - maiplot-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: maiplot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"   # SCRUM-35 AC: Grafana on host port 3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - maiplot-net

  # =====================================================================
  # Application services (auth-service, listing-service, ..., web)
  # are appended in Build E of SCRUM-35.
  # =====================================================================

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  maiplot-net:
    driver: bridge
